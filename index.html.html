<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Orçamento Pessoal</title>
<style>
:root{
  --navy:#1F3A5F; --navy-dark:#16293F; --bg:#F3F5F8; --card:#FFFFFF;
  --line:#E1E6ED; --text:#1B2430; --muted:#6B7686;
  --green:#1E8E5A; --green-bg:#E7F5EE; --red:#C0392B; --red-bg:#FBEAE8;
  --amber:#D97706; --amber-dark:#B45F04;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.4;}
body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);}
h1,h2,h3{margin:0;font-weight:700;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select{font-family:inherit;font-size:15px;}

.topbar{position:sticky;top:0;z-index:10;background:var(--navy);
  padding:calc(env(safe-area-inset-top,0) + 14px) 16px 0 16px;color:#fff;}
.topbar h1{font-size:18px;letter-spacing:-.2px;margin-bottom:12px;}
.month-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.month-nav::-webkit-scrollbar{display:none;}
.month-pill{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:#2E4F7C;
  color:#CBD8EA;font-size:13.5px;font-weight:600;white-space:nowrap;}
.month-pill.active{background:#fff;color:var(--navy);}

main{max-width:640px;margin:0 auto;padding:16px 12px 100px 12px;}

.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);
  margin-bottom:16px;overflow:hidden;}
.card-head{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;border-bottom:1px solid var(--line);}
.card-head h2{font-size:14.5px;color:var(--navy);}
.card-head button{background:none;color:var(--navy);font-size:13px;font-weight:600;padding:4px 6px;}

.repeat-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(135deg,var(--amber),var(--amber-dark));border-radius:var(--radius);
  padding:12px 14px;margin-bottom:16px;color:#fff;}
.repeat-bar p{margin:0;font-size:13px;font-weight:600;line-height:1.3;}
.repeat-bar small{display:block;font-weight:400;opacity:.9;font-size:11.5px;margin-top:2px;}
.repeat-btn{background:#fff;color:var(--amber-dark);font-weight:700;font-size:13px;
  padding:9px 14px;border-radius:8px;white-space:nowrap;}
.repeat-btn:active{transform:scale(.97);}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{border-collapse:collapse;width:100%;min-width:460px;}
th{background:#F7F9FB;color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.3px;font-weight:700;text-align:left;padding:8px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:5px 6px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
td input,td select{width:100%;border:1px solid transparent;background:#FCFBF6;
  border-radius:6px;padding:6px 7px;color:var(--text);min-width:70px;}
td input:focus,td select:focus{outline:none;border-color:var(--navy);background:#fff;}
td.readonly{color:var(--muted);font-size:13.5px;padding:6px 8px;white-space:nowrap;}
.del-btn{background:none;color:#B9422F;font-size:17px;padding:4px 8px;line-height:1;}
.add-row{width:100%;background:#F7F9FB;color:var(--navy);font-weight:600;font-size:13px;
  padding:10px;border-top:1px solid var(--line);}

.totals-row{display:flex;justify-content:space-between;padding:9px 14px;font-size:13.5px;
  border-top:1px solid var(--line);}
.totals-row.strong{font-weight:700;}
.totals-row .green{color:var(--green);}
.totals-row .red{color:var(--red);}

.summary{padding:16px 14px;}
.summary h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;
  margin-bottom:10px;}
.summary-line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;
  border-bottom:1px dashed var(--line);}
.summary-line:last-of-type{border-bottom:none;}
.saldo-box{margin-top:12px;padding:14px;border-radius:8px;text-align:center;}
.saldo-box.pos{background:var(--green-bg);}
.saldo-box.neg{background:var(--red-bg);}
.saldo-box .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.saldo-box .value{font-size:26px;font-weight:800;margin-top:2px;}
.saldo-box.pos .value{color:var(--green);}
.saldo-box.neg .value{color:var(--red);}

.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  padding:10px 12px calc(env(safe-area-inset-bottom,0) + 10px) 12px;display:flex;gap:8px;z-index:10;}
.footer button{flex:1;padding:11px 8px;border-radius:8px;font-size:13px;font-weight:700;}
.btn-export{background:var(--navy);color:#fff;}
.btn-import{background:#EEF1F5;color:var(--navy);}
.empty-note{padding:14px;color:var(--muted);font-size:13px;font-style:italic;}
.note{padding:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);}
</style>
</head>
<body>

<div class="topbar">
  <h1>💰 Orçamento Pessoal</h1>
  <div class="month-nav" id="monthNav"></div>
</div>

<main id="main"></main>

<div class="footer">
  <button class="btn-export" id="exportBtn">⬇ Exportar dados</button>
  <button class="btn-import" id="importBtn">⬆ Importar dados</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</div>

<script>
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const STORAGE_KEY = 'orcamento-pessoal-v1';
let state = { current: 'Setembro', months: {} };

function blankMonth(){ return { mov: [], fixos: [], cartao: [] }; }
function emptyMovRow(){ return { data:'', desc:'', valor:'', tipo:'Saída' }; }
function emptyFixoRow(desc){ return { desc: desc||'', valor:'' }; }
function emptyCartaoRow(){ return { desc:'', valorTotal:'', parcelas:'', pagas:'' }; }

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(parsed && parsed.months) state = parsed; }
  }catch(e){ console.warn('Falha ao carregar dados salvos', e); }
  MESES.forEach(m=>{ if(!state.months[m]) state.months[m] = blankMonth(); });
  if(!MESES.includes(state.current)) state.current = 'Janeiro';
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('Falha ao salvar', e); }
}

function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function brl(v){ return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function shiftMonthDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  d.setMonth(d.getMonth()+1);
  return d.toISOString().slice(0,10);
}

function ensureFixosSeed(monthName){
  const idx = MESES.indexOf(monthName);
  const mData = state.months[monthName];
  if(idx>0 && mData.fixos.length===0){
    const prev = state.months[MESES[idx-1]];
    if(prev.fixos.length){
      mData.fixos = prev.fixos.map(f=>emptyFixoRow(f.desc));
    }
  }
}

// First time a month is opened (completely blank), pre-draw a few empty rows
// so the tables aren't empty-looking, same spirit as the spreadsheet's rows.
function ensureMinRows(monthName){
  const m = state.months[monthName];
  const isFresh = m.mov.length===0 && m.fixos.length===0 && m.cartao.length===0;
  if(isFresh){
    ensureFixosSeed(monthName);
    while(m.mov.length<5) m.mov.push(emptyMovRow());
    while(m.fixos.length<4) m.fixos.push(emptyFixoRow());
    while(m.cartao.length<2) m.cartao.push(emptyCartaoRow());
    save();
  }
}

function computeCartaoRow(row){
  const total = num(row.valorTotal), parcelas = num(row.parcelas), pagas = num(row.pagas);
  const parcela = parcelas>0 ? total/parcelas : 0;
  const pagoMes = (parcelas>0 && pagas>0 && pagas<=parcelas) ? parcela : 0;
  const restante = parcelas>0 ? Math.max(total - parcela*pagas, 0) : 0;
  return { parcela, pagoMes, restante };
}

function computeTotals(monthName){
  const m = state.months[monthName];
  const entradas = m.mov.filter(r=>r.tipo==='Entrada').reduce((s,r)=>s+num(r.valor),0);
  const saidas = m.mov.filter(r=>r.tipo==='Saída').reduce((s,r)=>s+num(r.valor),0);
  const totalFixos = m.fixos.reduce((s,r)=>s+num(r.valor),0);
  let cartaoMes=0, jaPago=0, aindaFalta=0, totalParcelamentos=0;
  m.cartao.forEach(r=>{
    const c = computeCartaoRow(r);
    cartaoMes += c.pagoMes; aindaFalta += c.restante; totalParcelamentos += num(r.valorTotal);
    jaPago += c.parcela*num(r.pagas);
  });
  const saldo = entradas - saidas - totalFixos - cartaoMes;
  return { entradas, saidas, totalFixos, cartaoMes, jaPago, aindaFalta, totalParcelamentos, saldo };
}

// ---------- rendering ----------
function renderNav(){
  const nav = document.getElementById('monthNav');
  nav.innerHTML = MESES.map(m=>
    `<div class="month-pill${m===state.current?' active':''}" data-m="${m}">${m.slice(0,3)}</div>`
  ).join('');
  nav.querySelectorAll('.month-pill').forEach(p=>{
    p.addEventListener('click', ()=>{ state.current = p.dataset.m; save(); renderAll(); });
  });
}

function renderMain(){
  const monthName = state.current;
  ensureMinRows(monthName);
  const idx = MESES.indexOf(monthName);
  const main = document.getElementById('main');
  const m = state.months[monthName];

  let html = '';
  if(idx>0){
    html += `<div class="repeat-bar">
      <p>🔁 Repetir dados do mês anterior
      <small>Copia Movimentações, Gastos Fixos e Cartão de ${MESES[idx-1]} (parcelas avançam automaticamente)</small></p>
      <button class="repeat-btn" id="repeatBtn">Repetir</button>
    </div>`;
  } else {
    html += `<div class="empty-note">Janeiro é o primeiro mês do ano — não há mês anterior para repetir.</div>`;
  }

  // Movimentações
  html += `<div class="card"><div class="card-head"><h2>MOVIMENTAÇÕES</h2></div>
  <div class="table-scroll"><table><thead><tr>
  <th>Data</th><th>Descrição</th><th>Valor (R$)</th><th>Tipo</th><th></th>
  </tr></thead><tbody id="movBody">`;
  m.mov.forEach((r,i)=>{
    html += `<tr>
      <td><input type="date" data-sec="mov" data-i="${i}" data-f="data" value="${r.data}"></td>
      <td><input type="text" data-sec="mov" data-i="${i}" data-f="desc" value="${r.desc}" placeholder="Descrição"></td>
      <td><input type="number" step="0.01" inputmode="decimal" data-sec="mov" data-i="${i}" data-f="valor" value="${r.valor}" placeholder="0,00"></td>
      <td><select data-sec="mov" data-i="${i}" data-f="tipo">
        <option${r.tipo==='Entrada'?' selected':''}>Entrada</option>
        <option${r.tipo==='Saída'?' selected':''}>Saída</option>
      </select></td>
      <td><button class="del-btn" data-sec="mov" data-i="${i}" data-action="del">✕</button></td>
    </tr>`;
  });
  html += `</tbody></table></div><button class="add-row" data-sec="mov">+ Adicionar movimentação</button></div>`;

  // Gastos Fixos
  html += `<div class="card"><div class="card-head"><h2>GASTOS FIXOS</h2></div>
  <div class="table-scroll"><table><thead><tr><th>Descrição</th><th>Valor (R$)</th><th></th></tr></thead><tbody id="fixosBody">`;
  m.fixos.forEach((r,i)=>{
    html += `<tr>
      <td><input type="text" data-sec="fixos" data-i="${i}" data-f="desc" value="${r.desc}" placeholder="Ex: Aluguel"></td>
      <td><input type="number" step="0.01" inputmode="decimal" data-sec="fixos" data-i="${i}" data-f="valor" value="${r.valor}" placeholder="0,00"></td>
      <td><button class="del-btn" data-sec="fixos" data-i="${i}" data-action="del">✕</button></td>
    </tr>`;
  });
  html += `</tbody></table></div><button class="add-row" data-sec="fixos">+ Adicionar gasto fixo</button>
  <div class="totals-row strong"><span>Total Gastos Fixos</span><span id="totFixos"></span></div></div>`;

  // Cartão
  html += `<div class="card"><div class="card-head"><h2>CARTÃO DE CRÉDITO</h2></div>
  <div class="table-scroll"><table><thead><tr>
  <th>Descrição</th><th>Total (R$)</th><th>Parcelas</th><th>Pagas</th>
  <th>Parcela</th><th>Pago no mês</th><th>Restante</th><th></th>
  </tr></thead><tbody id="cartaoBody">`;
  m.cartao.forEach((r,i)=>{
    const c = computeCartaoRow(r);
    html += `<tr>
      <td><input type="text" data-sec="cartao" data-i="${i}" data-f="desc" value="${r.desc}" placeholder="Ex: Notebook"></td>
      <td><input type="number" step="0.01" inputmode="decimal" data-sec="cartao" data-i="${i}" data-f="valorTotal" value="${r.valorTotal}" placeholder="0,00"></td>
      <td><input type="number" step="1" min="0" data-sec="cartao" data-i="${i}" data-f="parcelas" value="${r.parcelas}" placeholder="0"></td>
      <td><input type="number" step="1" min="0" data-sec="cartao" data-i="${i}" data-f="pagas" value="${r.pagas}" placeholder="0"></td>
      <td class="readonly">${brl(c.parcela)}</td>
      <td class="readonly">${brl(c.pagoMes)}</td>
      <td class="readonly">${brl(c.restante)}</td>
      <td><button class="del-btn" data-sec="cartao" data-i="${i}" data-action="del">✕</button></td>
    </tr>`;
  });
  html += `</tbody></table></div><button class="add-row" data-sec="cartao">+ Adicionar compra parcelada</button>
  <div class="totals-row"><span>Total parcelamentos</span><span id="totParc"></span></div>
  <div class="totals-row green"><span>Já foi pago (acumulado)</span><span id="totJaPago"></span></div>
  <div class="totals-row red"><span>Ainda falta pagar</span><span id="totFalta"></span></div>
  </div>`;

  // Resumo / Saldo
  html += `<div class="card summary"><h2>Resumo do mês</h2>
  <div class="summary-line"><span>Total entradas</span><span id="sEntradas" style="color:var(--green);font-weight:700"></span></div>
  <div class="summary-line"><span>Total saídas</span><span id="sSaidas" style="color:var(--red);font-weight:700"></span></div>
  <div class="summary-line"><span>Gastos fixos</span><span id="sFixos"></span></div>
  <div class="summary-line"><span>Cartão pago no mês</span><span id="sCartao"></span></div>
  <div class="saldo-box" id="saldoBox"><div class="label">Saldo do mês</div><div class="value" id="saldoValue"></div></div>
  </div>`;

  main.innerHTML = html;
  attachSectionEvents();
  refreshComputed();

  if(idx>0){
    document.getElementById('repeatBtn').addEventListener('click', ()=>repeatFromPrevious(monthName));
  }
}

function attachSectionEvents(){
  const main = document.getElementById('main');
  main.querySelectorAll('input,select').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      const {sec,i,f} = el.dataset;
      state.months[state.current][sec][i][f] = el.value;
      save();
      refreshComputed();
    });
  });
  main.querySelectorAll('[data-action="del"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const {sec,i} = btn.dataset;
      state.months[state.current][sec].splice(i,1);
      save(); renderMain();
    });
  });
  main.querySelectorAll('.add-row').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sec = btn.dataset.sec;
      const arr = state.months[state.current][sec];
      if(sec==='mov') arr.push(emptyMovRow());
      else if(sec==='fixos') arr.push(emptyFixoRow());
      else arr.push(emptyCartaoRow());
      save(); renderMain();
    });
  });
}

function refreshComputed(){
  // update readonly cartão columns without full re-render
  const rows = document.querySelectorAll('#cartaoBody tr');
  const cartao = state.months[state.current].cartao;
  rows.forEach((tr,i)=>{
    const c = computeCartaoRow(cartao[i]);
    const tds = tr.querySelectorAll('td.readonly');
    tds[0].textContent = brl(c.parcela);
    tds[1].textContent = brl(c.pagoMes);
    tds[2].textContent = brl(c.restante);
  });
  const t = computeTotals(state.current);
  document.getElementById('totFixos').textContent = brl(t.totalFixos);
  document.getElementById('totParc').textContent = brl(t.totalParcelamentos);
  document.getElementById('totJaPago').textContent = brl(t.jaPago);
  document.getElementById('totFalta').textContent = brl(t.aindaFalta);
  document.getElementById('sEntradas').textContent = brl(t.entradas);
  document.getElementById('sSaidas').textContent = brl(t.saidas);
  document.getElementById('sFixos').textContent = brl(t.totalFixos);
  document.getElementById('sCartao').textContent = brl(t.cartaoMes);
  document.getElementById('saldoValue').textContent = brl(t.saldo);
  const box = document.getElementById('saldoBox');
  box.className = 'saldo-box ' + (t.saldo>=0?'pos':'neg');
}

function repeatFromPrevious(monthName){
  const idx = MESES.indexOf(monthName);
  if(idx<=0) return;
  if(!confirm('Isso vai substituir os dados atuais de '+monthName+' pelos dados repetidos de '+MESES[idx-1]+'. Continuar?')) return;
  const prev = state.months[MESES[idx-1]];

  const mov = prev.mov.filter(r=>r.desc||r.valor).map(r=>({...r, data: shiftMonthDate(r.data)}));
  const fixos = prev.fixos.filter(r=>r.desc||r.valor).map(r=>({...r}));
  const cartao = prev.cartao.filter(r=>r.desc||r.valorTotal).map(r=>{
    const parcelas = num(r.parcelas), pagas = num(r.pagas);
    const novasPagas = parcelas>0 ? Math.min(pagas+1, parcelas) : 0;
    return { desc:r.desc, valorTotal:r.valorTotal, parcelas:r.parcelas, pagas: String(novasPagas) };
  });

  state.months[monthName] = { mov, fixos, cartao };
  save();
  renderMain();
}

function renderAll(){ renderNav(); renderMain(); }

// ---------- export / import ----------
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `orcamento-pessoal-${today}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !parsed.months) throw new Error('Arquivo inválido');
      if(confirm('Importar estes dados vai substituir tudo que está salvo neste dispositivo. Continuar?')){
        state = parsed;
        MESES.forEach(m=>{ if(!state.months[m]) state.months[m] = blankMonth(); });
        if(!MESES.includes(state.current)) state.current = 'Janeiro';
        save(); renderAll();
        alert('Dados importados com sucesso.');
      }
    }catch(err){
      alert('Não foi possível ler este arquivo. Verifique se é um export válido do Orçamento Pessoal.');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

load();
renderAll();
</script>
</body>
</html>
